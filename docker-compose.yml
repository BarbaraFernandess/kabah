version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kabah_postgres
    environment:
      POSTGRES_USER: kabah
      POSTGRES_PASSWORD: kabah
      POSTGRES_DB: kabah
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabah"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: kabah_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://kabah:kabah@postgres:5432/kabah"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
    ports:
      - "3001:3001"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: kabah_web
    depends_on:
      - api
    environment:
      VITE_API_URL: "http://localhost:3001"
    ports:
      - "5173:80"

volumes:
  postgres_data:
