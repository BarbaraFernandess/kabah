version: '3.9'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: kabah_api
    environment:
      DATABASE_URL: "file:/data/kabah.db"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
    volumes:
      - sqlite_data:/data
    ports:
      - "3001:3001"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: kabah_web
    depends_on:
      - api
    environment:
      VITE_API_URL: "http://localhost:3001"
    ports:
      - "5173:80"

volumes:
  sqlite_data:
